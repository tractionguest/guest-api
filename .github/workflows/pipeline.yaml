name: pipeline
on: push

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.ref }}-deploy
  cancel-in-progress: true

jobs:
  validate_yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Run Spectral
      - uses: stoplightio/spectral-action@latest
        with:
          file_glob: 'openapi.yml'

  validate_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          #cache: 'yarn'

      - name: Install yarn dependencies
        run: npm install --frozen-lockfile

      - name: Run danger
        run: npx danger ci

  build:
    runs-on: ubuntu-latest
    needs: validate_yaml
    if: github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install shyaml
          npm install -g swagger-cli redoc-cli speccy

      - name: Set API version
        run: source ./build-scripts/prepare_environment.sh

      - name: Bundle OpenAPI spec
        run: swagger-cli bundle openapi.yml > bundled_openapi.json

      - name: Validate OpenAPI spec
        run: ./openapi-generator.sh validate -i bundled_openapi.json

      - name: Clear generated content
        run: |
          rm -rf guest-*-sdk
          rm -rf docs/index.html

      - name: Set up SSH for SDK repositories
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SDK_DEPLOY_KEY }}

      - name: Build & deploy SDKs
        run: ./build-scripts/generate_sdks.sh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Build documentation HTML
        run: ./build-scripts/redoc.sh

      - name: Deploy documentation
        run: ./build-scripts/git.sh .
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}