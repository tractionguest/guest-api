name: Idempotency-Key
description: >-
  An optional idempotency key to allow for repeat API requests. Any API request
  with this key will only be executed once, no matter how many times it's
  submitted. We store idempotency keys for only 24 hours. Any `Idempotency-Key`
  shorter than 10 characters will be ignored
schema:
  type: string
in: header
required: false
