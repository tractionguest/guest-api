get:
  summary: List all Group Visits (Appointments)
  tags:
    - GroupVisits
  responses:
    '200':
      description: Successful response - returns an array of `GroupVisit` entities.
      content:
        application/json:
          schema:
            $ref: ./models/PaginatedGroupVisitsList.v1.yaml
          examples:
            default:
              value:
                pagination:
                  total_records: 0
                  current_offset: 0
                  next_offset: 0
                  last_id: 0
                  limit: 0
                group_visits:
                  - id: 1
                    location:
                      id: 1
                      name: Location Name
                      max_capacity: 10
                      timezone: UTC
                    hosts:
                      - id: 0
                        email: email@sample.com
                        first_name: John
                        last_name: Smith
                        profile_pic_url: string
                        department: Accounting
                        mobile_number: string
                    name: Appointment Name
                    start_time: '2021-01-01T12:34:56Z'
                    end_time: '2021-01-01T12:34:56Z'
                    created_at: '2021-01-01T12:34:56Z'
                    updated_at: '2021-01-01T12:34:56Z'
                    registration_limit: 5
                    registration_url: null
                    invites_count: 0
                    unconfirmed_registrations_count: 0
                    manual_registration_approval: true
                    public_registration_enabled: true
    '400':
      description: A generic error
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
    '401':
      description: You do not have permission to view this
    '403':
      description: You do not have permission for this action
  security:
    - TractionGuestAuth:
        - all
        - visitors:*
        - visitors:read
  operationId: getGroupVisits
  description: Gets a list of all `GroupVisit` entities (Appointments).
  parameters:
    - schema:
        type: string
      in: query
      name: limit
      description: Limits the results to a specified number. Defaults to 50.
    - schema:
        type: string
      in: query
      name: offset
      description: Offsets the results to a specified number. Defaults to 0.
    - schema:
        type: string
      in: query
      name: location_ids
      description: >-
        A comma-separated string of locations IDs, to only show group visits
        (appointments) from those locations.
    - schema:
        type: string
      in: query
      name: sort_with
      description: >-
        A combination of attribute and direction, joined with an underscore, for
        sorting. Valid attributes are: `created_at`, `updated_at`, `name`, and
        `start_time`. Valid directions are `asc` and `desc`. E.g., `name_desc`,
        `start_time_asc`.
post:
  summary: Create a new Group Visit (Appointment)
  security:
    - TractionGuestAuth:
        - all
        - visitors:*
        - visitors:write
  operationId: createGroupVisit
  responses:
    '201':
      description: Created the `GroupVisit`
      content:
        application/json:
          schema:
            $ref: ./models/GroupVisit.v1.yaml
          examples:
            default:
              value:
                id: 0
                location:
                  id: 0
                  name: Location Name
                  max_capacity: 0
                  timezone: UTC
                hosts:
                  - id: 0
                    email: email@sample.com
                    first_name: Jane
                    last_name: Doe
                    profile_pic_url: string
                    department: Engineering
                    mobile_number: string
                name: Appointment Name
                start_time: '2021-01-01T12:34:56Z'
                end_time: '2021-01-01T12:34:56Z'
                created_at: '2021-01-01T12:34:56Z'
                updated_at: '2021-01-01T12:34:56Z'
                registration_limit: 0
                registration_url: url
                invites_count: 0
                unconfirmed_registrations_count: 0
                manual_registration_approval: true
                public_registration_enabled: true
    '400':
      description: A generic error
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
    '401':
      description: You do not have permission to create this
    '403':
      description: You do not have permission for this action
    '422':
      description: Your request was not formatted correctly
  description: Creates a `GroupVisit` (Appointment)
  parameters:
    - $ref: ../components/parameters/idempotencyKey.yml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ./models/GroupVisitCreateParams.v1.yaml
    description: ''
  tags:
    - GroupVisits
