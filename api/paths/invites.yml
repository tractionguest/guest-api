summary: Path used to manage the list of Invites.
description: >-
  The REST endpoint/path used to list and create zero or more `Invite`
  entities.  This path contains a `GET` and `POST` operation to perform the list
  and create tasks, respectively.
get:
  tags:
    - Invites
  parameters:
    - name: limit
      description: Limits the results to a specified number, defaults to 50
      schema:
        type: integer
      in: query
    - name: offset
      description: Offsets the results to a specified number, defaults to 0
      schema:
        type: integer
      in: query
    - name: query
      description: Filters by `first_name`, `last_name`, `company`, and `email`
      schema:
        type: string
      in: query
    - name: with_colours
      description: |-
        A comma separated list of case-insensitive colour values.
        i.e., `red`, `green`, `yellow`, and `orange`
      schema:
        type: string
      in: query
    - name: location_ids
      description: A comma separated list of Location IDs
      schema:
        type: string
      in: query
    - name: sort_by
      description: >-
        Sorts by the field name and direction provided where the pattern is
        `FIELD_NAME_DIRECTION`
      schema:
        enum:
          - start_date_asc
          - start_date_desc
          - end_date_asc
          - end_date_desc
          - created_at_asc
          - created_at_desc
          - updated_at_asc
          - updated_at_desc
      in: query
    - name: starts_before
      description: Filters results to all those *before* the provided datetime
      schema:
        format: date
        type: string
      in: query
    - name: starts_after
      description: Filters results to all those *after* the provided datetime
      schema:
        format: date
        type: string
      in: query
    - name: include
      description: |-
        A list of comma-separated related models to include
        i.e., 'assigned_stall'
      schema:
        type: string
      in: query
    - name: is_approved
      description: >-
        True to return approved and auto approved invites, False to return
        pending and rejected invites
      schema:
        type: boolean
      in: query
    - name: active_after
      description: >-
        Checks that an invite hasn't yet started, or has started and is still
        active after a specified time
      schema:
        format: date-time
        type: string
      in: query
    - name: active_before
      description: Checks that an invite hasn't ended before a specified time
      schema:
        format: date-time
        type: string
      in: query
