  operationId: updateInvite
  summary: Update an Invite
  description: Updates an existing `Invite`.
delete:
  tags:
    - Invites
  parameters:
    - $ref: ../components/parameters/idempotencyKey.yml
  responses:
    '204':
      description: The `Invite` has been deleted
    '400':
      content:
        application/json:
          schema:
            $ref: ../models/ErrorsList.v1.yaml
          examples:
            default:
              value:
                errors:
                  - domain: some text
                    attribute: some text
                    code: some text
                    message: some text
                  - domain: some text
                    attribute: some text
                    code: some text
                    message: some text
      description: There was an error in trying to delete the `Invite`
  operationId: deleteInvite
  summary: Deletes an Invite
  description: Deletes a single instance of `Invite`
parameters:
  - schema:
      type: string
    name: invite_id
    in: path
    required: true
