summary: Path used to manage a single Location's invites.
description: >-
  The REST endpoint/path used to create single instances of an `Invite` for a
  specific `Location`.
post:
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../models/InviteCreateParams.v1.yaml
        examples:
          default:
            value:
              company: some text
              email: some text
              end_date: '2020-07-17T01:59:59.999Z'
              last_name: some text
              start_date: '2020-07-17T01:59:59.999Z'
              title: some text
              watchlist_colour: ORANGE
              host_ids:
                - 96
                - 2
              custom_fields:
                - format: string
                  field_name: some text
                  field_value: some text
                - format: string
                  field_name: some text
                  field_value: some text
              email_template_id: 53
              mobile_number: some text
              first_name: some text
              license_plate: some text
              notification_triggers:
                - offset_direction: BEFORE
                  offset_unit: days
                  offset_amount: 34
                  offset_origin: START
                  email_template_id: 63
                  notification_groups:
                    - some text
                    - some text
                - offset_direction: AFTER
                  offset_unit: hours
                  offset_amount: 12
                  offset_origin: END
                  email_template_id: 2
                  notification_groups:
                    - some text
                    - some text
              parking_stall:
                stall_number: 66
                parking_lot_id: 321
                parking_stall_id: 332
    required: true
  tags:
    - Invites
  parameters:
    - $ref: ../components/parameters/idempotencyKey.yml
  responses:
    '201':
      content:
        application/json:
          schema:
            $ref: ../models/InviteDetail.v1.yaml
          examples:
            default:
              value:
                id: 93
                company: some text
                created_at: '2020-07-17T01:59:59.999Z'
                email: some text
                end_date: '2020-07-17T01:59:59.999Z'
                first_name: some text
                last_name: some text
                license_plate: some text
                start_date: '2020-07-17T01:59:59.999Z'
                hosts:
                  - id: 23
                    email: some text
                    first_name: some text
                    last_name: some text
                    mobile_number: some text
                    profile_pic_url: some text
                  - id: 33
                    email: some text
                    first_name: some text
                    last_name: some text
                    mobile_number: some text
                    profile_pic_url: some text
                location:
                  id: 20
                  name: some text
                watchlist_colour: YELLOW
                template:
                  id: 15
                  name: some text
                  template_type: some text
                custom_fields:
                  - format: string
                    field_name: some text
                    field_value: some text
                  - format: string
                    field_name: some text
                    field_value: some text
                notification_triggers:
                  - offset_direction: AFTER
                    offset_amount: 66
                    offset_origin: END
                    email_template_id: 80
                    notification_groups:
                      - some text
                      - some text
                    offset_unit: hours
                    email_template_name: some text
                  - offset_direction: BEFORE
                    offset_amount: 21
                    offset_origin: END
                    email_template_id: 30
                    notification_groups:
                      - some text
                      - some text
                    offset_unit: days
                    email_template_name: some text
                mobile_number: some text
                invites_parking_lot:
                  id: 123
                  stall_number: 66
                  stall_type: private
                  parking_lot_name: some text
                  parking_lot_id: 321
                  parking_stall_id: 332
                invite_watchlist:
                  id: 3
                  external_colours:
                    - some text
                  internal_colours:
                    - some text
                    - some text
      description: Created the `Invite` for the `Location`
    '400':
      content:
        application/json:
          schema:
            $ref: ../models/ErrorsList.v1.yaml
          examples:
            default:
              value:
                errors:
                  - domain: some text
                    attribute: some text
                    code: some text
                    message: some text
                  - domain: some text
                    attribute: some text
                    code: some text
                    message: some text
      description: A generic error
    '401':
      description: You don't have permission to create this Invite
    '403':
      description: You do not have permission for this action
    '404':
      description: The Location does not exist
    '422':
      description: Your request was not formatted correctly
  operationId: createLocationInvite
  summary: Create an Invite
  description: Creates a new `Invite` for a specific `Location`.
parameters:
  - schema:
      type: string
    name: location_id
    in: path
    required: true
