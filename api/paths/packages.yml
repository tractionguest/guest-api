get:
  summary: Get packages
  tags:
    - Packages
  responses:
    '200':
      description: OK
      headers: {}
      content:
        application/json:
          schema:
            $ref: ./models/PaginatedPackagesList.v1.yaml
          examples:
            example:
              value:
                packages:
                  - id: 70
                    package_state: picked_up
                    recipient:
                      id: 5
                      email: tsala@example.com
                      first_name: Tatiane
                      last_name: Sala
                      mobile_number: (604)111-1111
                      profile_pic_url: https://i.pravatar.cc/
                      department: Development
                    location:
                      name: Vancouver
                      id: 2
                    carrier_name: Purolator
                    created_at: '2020-08-11T01:59:59.999Z'
                    picked_up_at: '2020-08-17T01:59:59.999Z'
                    image:
                      full_size_url: https://i.pravatar.cc/
                  - id: 72
                    package_state: processing
                    recipient: null
                    location:
                      name: Vancouver
                      id: 2
                    carrier_name: null
                    created_at: '2020-08-19T01:59:59.999Z'
                    picked_up_at: null
                    image:
                      full_size_url: https://i.pravatar.cc/
                  - id: 73
                    package_state: needs_attention
                    recipient: null
                    location:
                      name: Default
                      id: 1
                    carrier_name: null
                    created_at: '2020-09-18T01:59:59.999Z'
                    picked_up_at: null
                    image:
                      full_size_url: https://i.pravatar.cc/
                  - id: 74
                    package_state: recipient_matched
                    recipient:
                      id: 4
                      email: vbaldys@example.com
                      first_name: Veronica
                      last_name: Baldys
                      mobile_number: (604)999-9999
                      profile_pic_url: https://i.pravatar.cc/
                      department: Development
                    location:
                      name: Vancouver
                      id: 2
                    carrier_name: Canada Post
                    created_at: '2020-07-18T01:59:59.999Z'
                    picked_up_at: null
                    image:
                      full_size_url: https://i.pravatar.cc/
                pagination:
                  total_records: 5
                  current_offset: 0
                  next_offset: null
                  last_id: null
                  limit: 20
    4XX:
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
      description: ''
  operationId: getPackages
  description: Gets a list of [Package] entities.
  parameters:
    - schema:
        type: string
        example: 1,2,3
      in: query
      name: location_ids
      description: |-
        A comma separated list of Location ids for filtering. i.e. '1,2,3'
        Will return all packages from all locations if none are specified
    - schema:
        type: integer
        minimum: 1
        default: 50
      in: query
      name: limit
      description: Limits the results to a specified number, defaults to 50
    - schema:
        type: integer
        minimum: 0
        default: 0
      in: query
      name: offset
      description: Offsets the results to a specified number, defaults to 0
    - schema:
        type: string
        example: recipient,location,image
      in: query
      name: include
      description: >-
        A list of comma-separated related models to include. Possible values:
        'recipient', 'location', 'image'
    - schema:
        type: boolean
      in: query
      name: picked_up
      description: Filters packages by their "picked_up" state..
      allowEmptyValue: false
    - schema:
        type: string
      in: query
      name: query
      description: Searches for packages by recipient name
post:
  summary: Create package
  operationId: createPackage
  tags:
    - Packages
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ./models/Package.v1.yaml
          examples: {}
    4XX:
      description: ''
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
  description: >-
    Creates a [Package] entity by extracting information about the recipient and
    carrier from the given image file.
  requestBody:
    content:
      application/json:
        schema:
          $ref: ./models/PackageCreateParams.v1.yaml
    description: Parameters for creating a package
