get:
  summary: Get parking lots
  tags:
    - Parking
  responses:
    '200':
      description: OK
      headers: {}
      content:
        application/json:
          schema:
            $ref: ./models/PaginatedParkingLotsList.v1.yaml
          examples:
            example:
              value:
                parking_lots:
                  - id: 1
                    name: West Lot
                    user_id: 1
                    locations:
                      - id: 1
                        name: Default
                  - id: 2
                    name: East Lot
                    user_id: 1
                    locations:
                      - id: 2
                        name: Vancouver
                pagination:
                  total_records: 5
                  current_offset: 0
                  next_offset: null
                  last_id: null
                  limit: 20
    4XX:
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
      description: ''
  operationId: getParkingLots
  description: Gets a list of [ParkingLot] entities.
  parameters:
    - schema:
        type: integer
        minimum: 1
        default: 50
      in: query
      name: limit
      description: Limits the results to a specified number, defaults to 50
    - schema:
        type: integer
        minimum: 0
        default: 0
      in: query
      name: offset
      description: Offsets the results to a specified number, defaults to 0
