parameters:
  - schema:
      type: string
    name: parking_lot_id
    in: path
    required: true
  - schema:
      type: string
    name: stall_type
    in: query
    required: true
    description: >-
      The type of stall to filter by. E.g., 'Compact', 'Standard', 'Electric',
      'Handicapped'
  - schema:
      type: string
      format: date-time
    name: start_date
    in: query
    required: true
    description: The start date to filter by. E.g., '2024-06-13T15:30:00'
  - schema:
      type: string
      format: date-time
    name: end_date
    in: query
    required: true
    description: The end date to filter by. E.g., '2024-06-13T15:30:00'
  - schema:
      type: string
    name: timezone
    in: query
    required: false
    description: >-
      The IANA timezone to be used if not provided in both start_date and
      end_date. E.g., 'America/Vancouver'
get:
  summary: Get available stalls for stall type
  tags:
    - Parking
  responses:
    '200':
      description: OK
      headers: {}
      content:
        application/json:
          schema:
            $ref: ./models/ParkingLotAvailableStallsList.v1.yaml
          example:
            - parking_stall_id: 23
              range: null
              stall_count: 5
              open_stalls:
                - 1
                - 2
                - 3
                - 4
                - 5
    4XX:
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
      description: ''
  operationId: getParkingLotAvailableStalls
  description: Gets a list of [ParkingLotAvailableStalls] entities.
