parameters:
  - schema:
      type: string
    name: parking_lot_id
    in: path
    required: true
get:
  summary: Get stalls of parking lot
  tags:
    - Parking
  responses:
    '200':
      description: OK
      headers: {}
      content:
        application/json:
          schema:
            $ref: ../models/PaginatedParkingStallsList.v1.yaml
          examples:
            example:
              value:
                parking_stalls:
                  - id: 1
                    parking_lot_id: 1
                    stall_type: Handicap
                    range: 0
                    stall_count: 5
                    range_prefix: H
                    range_postfix: ''
                  - id: 2
                    parking_lot_id: 1
                    stall_type: General
                    range: 5
                    stall_count: 95
                    range_prefix: P
                    range_postfix: ''
                pagination:
                  total_records: 5
                  current_offset: 0
                  next_offset: null
                  last_id: null
                  limit: 20
    4XX:
      content:
        application/json:
          schema:
            $ref: ../models/ErrorsList.v1.yaml
      description: ''
  operationId: getParkingStalls
  description: Gets a list of [ParkingStall] entities.
  parameters:
    - schema:
        type: integer
        minimum: 1
        default: 50
      in: query
      name: limit
      description: Limits the results to a specified number, defaults to 50
    - schema:
        type: integer
        minimum: 0
        default: 0
      in: query
      name: offset
      description: Offsets the results to a specified number, defaults to 0
