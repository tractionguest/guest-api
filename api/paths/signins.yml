post:
  summary: Create Signin
  operationId: createSignin
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../models/Signin.v1.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../models/ErrorsList.v1.yaml
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '422':
      description: Unprocessable Entity (WebDAV)
  description: Creates a Signin
  tags:
    - Signins
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../models/SigninCreateParams.v1.yaml
        examples:
          default:
            value:
              guest_email_template_id: 47
              host_email_template_id: 65
              host_ids:
                - 77
                - 49
              location_id: 79
              send_notifications: true
              photos:
                - {}
                - {}
              sms_message: some text
              first_name: some text
              last_name: some text
              company: some text
              email: some text
          registration:
            value:
              registration_id: '123531144'
              guest_email_template_id: 47
              host_email_template_id: 65
              send_notifications: true
              sms_message: some text
    description: >-
      Params for creating a Signin can omit certain fields if a
      `registration_id` is present.
