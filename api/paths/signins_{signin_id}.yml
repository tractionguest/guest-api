  description: Gets the details of a single instance of a `Signin`.
put:
  requestBody:
    description: >-
      The only updatable values for a `Signin` are `badge_number`,
      `badge_returned`, `is_accounted_for`, `is_signed_out`, and
      `is_acknowledged`.

      `is_signed_out` and `is_acknowledged` are pseudo attributes that once set
      to true, are irreversible.
    content:
      application/json:
        schema:
          $ref: ../models/SigninUpdateParams.v1.yaml
        examples:
          default:
            value:
              is_signed_out: true
              is_acknowledged: true
              is_accounted_for: true
    required: true
  tags:
    - Signins
  parameters:
