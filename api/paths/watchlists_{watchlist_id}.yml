summary: Path used to manage a single Watchlist.
description: The REST endpoint/path used to get single instances of a `Watchlist`.
get:
  tags:
    - Watchlists
  parameters:
    - name: include
      description: A list of comma-separated related models to include
      schema:
        type: string
      in: query
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ./models/Watchlist.v1.yaml
          examples:
            default:
              value:
                id: 7
                colour: GREEN
                email: name@example.com
                first_name: Alex
                last_name: Trebec
                notes: some text
                photo: some text
                aliases:
                  - some text
                  - some text
                driver_license: some text
      description: Successful response - returns a single `Watchlist`.
    4XX:
      description: ''
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
          examples: {}
  security:
    - TractionGuestAuth:
        - all
        - watchlists:*
        - watchlists:read
  operationId: getWatchlist
  summary: Get a Watchlist
  description: Gets the details of a single instance of a `Watchlist`.
put:
  requestBody:
    description: The watchlist record attributes to update
    content:
      application/json:
        schema:
          $ref: ./models/WatchlistCreateParams.v1.yaml
        examples:
          NewWatchlist:
            value:
              colour: YELLOW
              email: some text
              first_name: some text
              last_name: some text
              notes: some text
              aliases:
                - some text
                - some text
              base64_image: base 64 encoded image
              driver_license: some text
    required: true
  tags:
    - Watchlists
  parameters:
    - $ref: ../components/parameters/idempotencyKey.yml
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ./models/Watchlist.v1.yaml
          examples:
            UpdatedWatchlist:
              value:
                id: 66
                colour: GREEN
                email: some text
                first_name: some text
                last_name: some text
                notes: some text
                photo: some text
                aliases:
                  - some text
                  - some text
                driver_license: some text
      description: The complete updated watchlist record
    4XX:
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
      description: Bad request
  security:
    - TractionGuestAuth:
        - all
        - watchlists:*
        - watchlists:write
  operationId: updateWatchlist
  summary: Update a Watchlist
  description: >-
    Update an existing `Watchlist` record. Every operation against this endpoint
    is recorded in the audit log.
delete:
  tags:
    - Watchlists
  parameters:
    - $ref: ../components/parameters/idempotencyKey.yml
  responses:
    '204':
      description: The Watchlist has been deleted
    4XX:
      content:
        application/json:
          schema:
            $ref: ./models/ErrorsList.v1.yaml
          examples:
            default:
              value:
                errors:
                  - domain: some text
                    attribute: some text
                    code: some text
                    message: some text
                  - domain: some text
                    attribute: some text
                    code: some text
                    message: some text
      description: Bad request
  security:
    - TractionGuestAuth:
        - all
        - watchlists:*
        - watchlists:write
  operationId: deleteWatchlist
  summary: Deletes a Watchlist
  description: Deletes a single instance of `Watchlist`
parameters:
  - schema:
      type: string
    name: watchlist_id
    in: path
    required: true
