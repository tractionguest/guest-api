title: WatchlistImportParams
type: object
description: The params needed to import Watchlists from a CSV
x-examples:
  default:
    csv_data: "first_name,last_name,email,colour,notes\nJane,Doe,jane.doe@example.com,RED,Do not admit\nJohn,Smith,,GREEN,"
properties:
  csv_data:
    type: string
    description: "The CSV content, with a header row. The imported columns are `first_name`, `last_name`, `email`, `colour` and `notes`; any other column is ignored. Each row needs a `colour` (RED, YELLOW, ORANGE, GREEN or SAFE) and either an `email` or both a `first_name` and a `last_name`."
required:
  - csv_data
